<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Folio iPad — Pencil Math Canvas</title><link rel="stylesheet" href="tokens.css"><style>
/* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 */
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:var(--canvas-bg);color:var(--ink);font:13px/1.5 var(--font)}button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;white-space:nowrap}button:hover{background:var(--panel-2)}button:active{background:var(--rule)}button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}button:disabled{opacity:.55;cursor:not-allowed}.app{height:100dvh;display:grid;grid-template-rows:42px minmax(0,1fr) 28px}.toolbar,.status{display:flex;align-items:center;background:var(--panel);border-bottom:1px solid var(--rule)}.brand{height:100%;display:grid;place-items:center;padding:0 16px;color:var(--bg);background:var(--ink);font-weight:800;letter-spacing:.08em}.modes{height:100%;display:flex;border-right:1px solid var(--rule)}.modes button,.tools button{min-width:76px;border-right:1px solid var(--rule)}.modes .active,.tools .active{background:var(--ink);color:var(--bg)}.tools{height:100%;display:flex;margin-left:auto}.stage{position:relative;min-height:0;overflow:hidden;touch-action:none}.paper{position:absolute;inset:0;overflow:auto;padding:44px max(44px,calc((100% - 860px)/2));background-image:linear-gradient(var(--canvas-grid) 1px,transparent 1px);background-size:100% 32px}.instruction{margin-bottom:32px;color:var(--muted);font-size:11px}.row{position:relative;width:100%;min-height:70px;display:grid;grid-template-columns:34px minmax(0,1fr) 72px;align-items:center;padding:0;text-align:left}.step{color:var(--muted);font:11px var(--font)}.ink{font:clamp(18px,2.5vw,25px) var(--font-hand);letter-spacing:.04em}.badge{justify-self:end;padding:1px 5px;border:1px solid var(--rule-strong);font:9px var(--font)}.row.selected .ink{outline:1px dashed var(--ink);outline-offset:10px;background:var(--selection-wash)}.row.selected:before{content:'LASSO';position:absolute;left:38px;top:0;padding:0 4px;background:var(--bg);font:9px var(--font)}.error{position:relative;font-weight:700}.error:after{content:'';position:absolute;left:-2px;right:-2px;bottom:-7px;border-bottom:2px solid var(--ink);transform:rotate(-1deg)}.intent{display:none;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);grid-template-columns:repeat(3,1fr);width:min(430px,calc(100% - 32px));background:var(--panel);border:1px solid var(--ink);box-shadow:0 14px 50px var(--shadow);z-index:3}.intent.show{display:grid}.intent button{min-height:48px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}.intent button:nth-child(3n){border-right:0}.intent button:hover{color:var(--bg);background:var(--ink)}.annotation{display:none;position:absolute;left:47%;top:54%;width:250px;color:var(--muted);font:17px var(--font-hand);transform:rotate(-2deg)}.annotation.show{display:block}.annotation:before{content:'↖';position:absolute;left:-46px;top:-27px;font-size:44px}.annotation.committed{color:var(--ink)}.confirm{display:none;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);align-items:center;background:var(--panel);border:1px solid var(--ink);z-index:4}.confirm.show{display:flex}.confirm span,.confirm button{padding:0 16px;min-height:42px;display:grid;place-items:center}.confirm button{border-left:1px solid var(--rule)}.status{border:0;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700}.status b{align-self:stretch;display:grid;place-items:center;min-width:84px;padding:0 10px;color:var(--ink);background:var(--panel-2)}.status span{padding:0 10px}.status .grow{flex:1}@media(max-width:620px){.brand{display:none}.modes button,.tools button{min-width:56px;font-size:11px}.paper{padding-inline:22px}.row{grid-template-columns:28px minmax(0,1fr) 58px}.ink{font-size:17px}}
</style></head><body><div class="app"><header class="toolbar"><div class="brand">FOLIO</div><div class="modes"><button>SOLO</button><button class="active">COACH</button><button>CHECK</button></div><div class="tools"><button class="active" data-tool>PEN</button><button data-tool>LASSO</button><button data-tool>ERASE</button></div></header><main class="stage"><div class="paper"><div class="instruction">PENCIL WRITES · TWO-FINGER PAN/ZOOM · LASSO SELECTS MATH OBJECTS</div><div class="row"><span class="step">01</span><div class="ink">A = [ 1  2  1 ; 2  5  3 ; 1  0  8 ]</div><span class="badge">PARSED</span></div><button class="row" data-row><span class="step">02</span><div class="ink">R₂ ← R₂ − 2R₁</div><span class="badge">VALID</span></button><button class="row selected" data-row><span class="step">03</span><div class="ink">R₃ ← R₃ − R₁</div><span class="badge">VALID</span></button><div class="row"><span class="step">04</span><div class="ink">[ 1  2  1 ; 0  1  1 ; 0  −2  7 ]</div><span class="badge">CHECKED</span></div><button class="row" data-row><span class="step">05</span><div class="ink">R₃ ← R₃ + <span class="error">3</span>R₂</div><span class="badge">ERROR</span></button></div><div class="intent show" id="intent"><button data-intent="check">CHECK</button><button data-intent="hint">HINT</button><button data-intent="explain">EXPLAIN</button><button data-intent="formalize">FORMALIZE</button><button data-intent="branch">BRANCH</button><button data-intent="visualize">VISUALIZE</button></div><div class="annotation" id="annotation">This should be 2R₂ to eliminate −2.</div><div class="confirm" id="confirm"><span>TENTATIVE INK</span><button data-confirm="accept">ACCEPT</button><button data-confirm="reject">REJECT</button></div></main><footer class="status"><b id="state">PEN</b><span class="grow" id="message">PENCIL WRITES · TOUCH NAVIGATES</span><span>100% · PAGE 1</span></footer></div><script>
const intent=document.querySelector('#intent'),annotation=document.querySelector('#annotation'),confirmBar=document.querySelector('#confirm'),state=document.querySelector('#state'),message=document.querySelector('#message');function status(name,text){state.textContent=name;message.textContent=text}document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>{button.parentElement.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));status(button.textContent,button.textContent==='PEN'?'PENCIL WRITES · TOUCH NAVIGATES':'SELECT ON CANVAS')});document.querySelectorAll('[data-row]').forEach(row=>row.onclick=()=>{document.querySelectorAll('[data-row]').forEach(item=>item.classList.toggle('selected',item===row));intent.classList.add('show');status('LASSO','CHOOSE INTENT')});document.querySelectorAll('[data-intent]').forEach(button=>button.onclick=()=>{intent.classList.remove('show');annotation.classList.add('show');annotation.classList.remove('committed');annotation.textContent=button.dataset.intent==='check'?'This should be 2R₂ to eliminate −2.':`${button.dataset.intent}: tentative annotation`;confirmBar.classList.add('show');status('REVIEW','AI INTERPRETATION IS TENTATIVE')});document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>{const accept=button.dataset.confirm==='accept';annotation.classList.toggle('show',accept);annotation.classList.toggle('committed',accept);confirmBar.classList.remove('show');status('PEN',accept?'ANNOTATION COMMITTED':'REJECTED · CANVAS UNCHANGED')});
</script></body></html>
