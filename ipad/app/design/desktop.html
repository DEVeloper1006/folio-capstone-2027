<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Folio Desktop — Math Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Hallmark · macrostructure: adaptive workbench · tone: strict · anchor hue: graphite
     * knobs: center=source+compiled split · modes=status-only
     * pre-emit critique: P5 H5 E5 S5 R5 V4
     */
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: clip; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); }
    button, input, textarea { outline: 2px solid transparent; outline-offset: 1px; font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; white-space: nowrap; }
    button:hover { background: var(--panel-2); }
    button:active { background: var(--rule); }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline-color: var(--ink); }
    button:disabled, input:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
    .app { height: 100dvh; display: grid; grid-template-rows: 38px minmax(0, 1fr) 28px; overflow: hidden; }
    .top, .status { min-width: 0; display: flex; align-items: center; }
    .top { border-bottom: 1px solid var(--rule); background: var(--panel); }
    .brand { height: 100%; display: grid; place-items: center; padding: 0 14px; color: var(--bg); background: var(--ink); font-weight: 800; letter-spacing: .08em; }
    .file { min-width: 0; flex: 1; overflow: hidden; padding: 0 14px; text-overflow: ellipsis; white-space: nowrap; }
    .file span, .runtime { color: var(--muted); }
    .runtime { margin-left: auto; padding: 0 14px; }
    .top-action { flex: 0 0 auto; align-self: stretch; padding: 0 14px; border-left: 1px solid var(--rule); font-weight: 700; }
    .work { min-height: 0; display: grid; grid-template-columns: 190px minmax(0, 1fr) 286px; }
    .rail, .inspect { min-width: 0; overflow: auto; background: var(--panel); }
    .rail { border-right: 1px solid var(--rule); }
    .inspect { border-left: 1px solid var(--rule); }
    .title { height: 34px; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .title span { margin-left: auto; }
    .tree, .keys { padding: 8px 0; }
    .tree button { width: 100%; min-height: 30px; padding: 0 10px; color: var(--muted); text-align: left; }
    .tree .active { color: var(--ink); background: var(--panel-2); border-left: 2px solid var(--ink); }
    .tree .indent { padding-left: 28px; }
    .keys { border-top: 1px solid var(--rule); margin-top: 14px; }
    .keys p { display: flex; justify-content: space-between; margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--line-subtle); color: var(--muted); font-size: 11px; }
    kbd { color: var(--ink); font: inherit; }
    .document-workspace { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr); }
    .editor-pane { min-width: 0; min-height: 0; position: relative; border-right: 1px solid var(--rule); background: var(--bg); }
    .gutter { position: absolute; inset: 0 auto 0 0; z-index: 2; width: 54px; padding-top: 20px; overflow: hidden; border-right: 1px solid var(--line-subtle); background: var(--panel); color: var(--dim); text-align: right; pointer-events: none; }
    .gutter span { display: block; height: 28px; padding-right: 12px; line-height: 28px; }
    .gutter span.active { color: var(--ink); font-weight: 700; }
    .editor { width: 100%; height: 100%; display: block; resize: none; overflow: auto; padding: 20px 22px 80px 72px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 15px; line-height: 28px; white-space: pre; tab-size: 2; caret-color: var(--ink); }
    .editor[readonly] { cursor: default; }
    .preview-pane { min-width: 0; min-height: 0; overflow: auto; background: var(--print-paper); color: var(--print-ink); }
    .preview-head { position: sticky; z-index: 3; top: 0; height: 34px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--rule); background: var(--panel); color: var(--muted); font: 11px/1 var(--font); letter-spacing: .08em; }
    .preview-head span { margin-left: auto; }
    .preview-body { padding: 28px 32px 80px; font: 16px/1.6 var(--font-print); }
    .preview-body h1, .preview-body h2, .preview-body h3 { overflow-wrap: anywhere; font-style: normal; }
    .preview-body h1 { margin: 0 0 24px; font-size: 24px; }
    .preview-body h2 { margin: 24px 0 12px; font-size: 19px; }
    .preview-body h3 { margin: 20px 0 8px; font-size: 15px; }
    .preview-body p { min-height: 1lh; margin: 0 0 10px; white-space: pre-wrap; }
    .preview-body p.formula { margin: 16px 0; text-align: center; }
    .preview-body mjx-container { overflow-x: auto; overflow-y: hidden; }
    .app.preview-hidden .document-workspace { grid-template-columns: minmax(0, 1fr); }
    .app.preview-hidden .preview-pane { display: none; }
    .block { padding: 10px; border-bottom: 1px solid var(--rule); }
    .block h2 { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .08em; }
    .readout { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .readout span { color: var(--muted); }
    .assume { padding: 8px; border: 1px solid var(--assumption-rule); background: var(--assumption-bg); }
    .actions button { width: 100%; min-height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; border: 1px solid var(--rule); border-bottom: 0; }
    .actions button:last-child { border-bottom: 1px solid var(--rule); }
    .status { background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status b { align-self: stretch; display: grid; place-items: center; min-width: 88px; padding: 0 10px; background: var(--panel-2); color: var(--ink); }
    .status .math-state { background: var(--rule-strong); color: var(--bg); }
    .status span { padding: 0 10px; }
    .status .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .commandbar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 28px; height: 38px; display: flex; border-top: 1px solid var(--ink); background: var(--bg); }
    .commandbar[hidden] { display: none; }
    .commandbar input { flex: 1; min-width: 0; padding: 0 12px; border: 0; outline: 0; background: var(--bg); }
    .mode-list { position: fixed; z-index: 11; left: 190px; right: 286px; bottom: 66px; display: grid; border: 1px solid var(--ink); background: var(--panel); }
    .mode-list[hidden] { display: none; }
    .mode-option { min-height: 44px; display: grid; grid-template-columns: 42px 110px 1fr; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--rule); text-align: left; }
    .mode-option:last-child { border-bottom: 0; }
    .mode-option span { color: var(--muted); }
    .mode-option.active { color: var(--bg); background: var(--ink); }
    .mode-option.active span { color: var(--bg); }
    dialog { width: min(760px, calc(100% - 32px)); max-height: min(720px, calc(100dvh - 32px)); padding: 0; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); }
    dialog::backdrop { background: var(--backdrop); }
    .dialog-head { min-height: 46px; display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
    .dialog-head h2 { margin: 0; padding: 0 14px; font-size: 12px; letter-spacing: .08em; }
    .dialog-head button { align-self: stretch; margin-left: auto; padding: 0 16px; border-left: 1px solid var(--rule); }
    .help-layout { display: grid; grid-template-columns: 170px minmax(0, 1fr); min-height: 410px; }
    .help-nav { border-right: 1px solid var(--rule); }
    .help-nav input { width: 100%; height: 44px; padding: 0 10px; border: 0; border-bottom: 1px solid var(--rule); background: var(--panel); }
    .help-nav button { width: 100%; min-height: 38px; padding: 0 10px; border-bottom: 1px solid var(--rule); color: var(--muted); text-align: left; }
    .help-nav button.active { color: var(--bg); background: var(--ink); }
    .help-body { overflow: auto; padding: 20px 24px 36px; }
    .help-body h3 { margin: 0 0 14px; font-size: 16px; }
    .help-body h4 { margin: 22px 0 8px; font-size: 11px; letter-spacing: .08em; }
    .help-body p { max-width: 68ch; margin: 0 0 12px; color: var(--muted); }
    .help-table { width: 100%; border-collapse: collapse; }
    .help-table th, .help-table td { padding: 7px 8px; border: 1px solid var(--rule); text-align: left; vertical-align: top; }
    .help-table th { width: 150px; background: var(--panel); font-weight: 500; }
    .export-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 18px; border-bottom: 1px solid var(--rule); }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    .field input { width: 100%; height: 44px; padding: 0 10px; border: 1px solid var(--rule); background: var(--panel); }
    .export-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .export-option { min-height: 96px; padding: 14px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); text-align: left; }
    .export-option:nth-child(2n) { border-right: 0; }
    .export-option b, .export-option span { display: block; }
    .export-option span { margin-top: 6px; color: var(--muted); white-space: normal; }
    .print-paper { display: none; }
    @page { size: Letter; margin: .8in .85in .75in; }
    @media print {
      html, body { overflow: visible; background: var(--print-paper); }
      body > *:not(.print-paper) { display: none !important; }
      .print-paper { display: block; color: var(--print-ink); background: var(--print-paper); font: 12pt/1.55 var(--font-print); }
      .paper-title { margin: 0 0 8pt; font-size: 18pt; line-height: 1.2; text-align: center; }
      .paper-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4pt 24pt; margin-bottom: 22pt; padding-bottom: 10pt; border-bottom: 1px solid var(--print-rule); font-size: 10pt; }
      .paper-meta span:nth-child(even) { text-align: right; }
      .paper-body h2 { margin: 18pt 0 8pt; font-size: 14pt; }
      .paper-body h3 { margin: 14pt 0 6pt; font-size: 12pt; }
      .paper-line { margin: 0 0 8pt; white-space: pre-wrap; }
      .paper-line.formula { margin: 10pt 0; text-align: center; font-size: 13pt; }
      .paper-line.proof { padding-left: 18pt; text-indent: -18pt; }
    }
    @media (max-width: 1100px) { .document-workspace { grid-template-columns: minmax(0, 1fr); } .app:not(.preview-only) .preview-pane { display: none; } .app.preview-only .editor-pane { display: none; } }
    @media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr) 250px; } .rail { display: none; } .mode-list { left: 0; right: 250px; } }
    @media (max-width: 650px) { .work { grid-template-columns: 1fr; } .inspect, .runtime { display: none; } .file { padding: 0 8px; } .top-action { padding: 0 8px; } .mode-list { right: 0; } .help-layout { grid-template-columns: 1fr; } .help-nav { border-right: 0; border-bottom: 1px solid var(--rule); } .export-form, .export-options { grid-template-columns: 1fr; } .export-option { border-right: 0; } }
    @media (max-width: 480px) { .file { display: none; } .top-action { flex: 1; } }
  </style>
</head>
<body>
  <div class="app" data-editor-state="NORMAL" data-math-context="linalg">
    <header class="top">
      <div class="brand">FOLIO</div>
      <div class="file">workspace.folio <span id="dirty-mark">— saved locally</span></div>
      <div class="runtime">LOCAL · <span id="char-count">0 CHARS</span></div>
      <button class="top-action" id="help-button">HELP</button>
      <button class="top-action" id="preview-button">VIEW</button>
      <button class="top-action" id="export-button">EXPORT</button>
    </header>

    <main class="work">
      <aside class="rail">
        <div class="title">BUFFER <span>1</span></div>
        <nav class="tree" id="tree" aria-label="Document structure"></nav>
        <div class="title">MATH MACROS <span>\</span></div>
        <div class="keys" id="keys"></div>
      </aside>

      <section class="document-workspace" aria-label="Source and compiled document">
        <section class="editor-pane" aria-label="Math editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <textarea class="editor" id="editor" aria-label="Document text" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" readonly></textarea>
        </section>
        <aside class="preview-pane" id="preview-pane" aria-label="Compiled document preview">
          <div class="preview-head">COMPILED DOCUMENT <span id="preview-mode">LINALG BINDS</span></div>
          <article class="preview-body" id="preview-body"></article>
        </aside>
      </section>

      <aside class="inspect">
        <div class="title">EDITOR <span>LIVE</span></div>
        <div class="block"><h2>CURSOR</h2><div class="readout" id="readout"></div></div>
        <div class="block"><h2>MATH MODE</h2><div class="assume" id="assumption"></div></div>
        <div class="block actions">
          <h2>VIM BINDINGS</h2>
          <button type="button"><span>insert before cursor</span><kbd>i</kbd></button>
          <button type="button"><span>append after cursor</span><kbd>a</kbd></button>
          <button type="button"><span>visual selection</span><kbd>v</kbd></button>
          <button type="button"><span>delete / yank line</span><kbd>dd / yy</kbd></button>
          <button type="button"><span>undo / redo</span><kbd>u / C-r</kbd></button>
          <button type="button"><span>record / play macro</span><kbd>q{r} / @{r}</kbd></button>
        </div>
        <div class="block actions">
          <h2>FILE</h2>
          <button id="save-button"><span>save locally</span><kbd>:w</kbd></button>
          <button id="mode-button"><span>cycle math mode</span><kbd>C-m</kbd></button>
          <button id="template-button"><span>load problem set</span><kbd>:template</kbd></button>
          <button id="export-side"><span>export assignment</span><kbd>:export</kbd></button>
          <button id="new-button"><span>reset current buffer</span><kbd>:new</kbd></button>
        </div>
      </aside>
    </main>

    <footer class="status">
      <b id="editor-state">NORMAL</b>
      <b class="math-state" id="math-state">LINALG</b>
      <span class="grow" id="message">Press i to edit · C-m cycles math mode · $...$ compiles</span>
      <span id="position">1:1</span>
    </footer>
  </div>

  <div class="mode-list" id="mode-list" hidden>
    <button class="mode-option active" data-mode-choice="linalg"><b>1</b><b>LINALG</b><span>matrices · row operations · RREF</span></button>
    <button class="mode-option" data-mode-choice="calculus"><b>2</b><b>CALC</b><span>derivatives · integrals · limits</span></button>
    <button class="mode-option" data-mode-choice="proof"><b>3</b><b>PROOF</b><span>assumptions · rewrites · QED</span></button>
  </div>

  <div class="commandbar" id="commandbar" hidden>
    <input id="command-input" aria-label="Command line" autocomplete="off" spellcheck="false">
  </div>

  <dialog id="help-dialog">
    <header class="dialog-head"><h2>FOLIO HELP</h2><button data-close-dialog="help-dialog">CLOSE <kbd>Esc</kbd></button></header>
    <div class="help-layout">
      <nav class="help-nav" aria-label="Help topics">
        <input id="help-search" aria-label="Filter help topics" placeholder="filter topics">
        <div id="help-topics"></div>
      </nav>
      <article class="help-body" id="help-content"></article>
    </div>
  </dialog>

  <dialog id="export-dialog">
    <header class="dialog-head"><h2>EXPORT ASSIGNMENT</h2><button data-close-dialog="export-dialog">CLOSE <kbd>Esc</kbd></button></header>
    <div class="export-form">
      <div class="field"><label for="meta-title">TITLE</label><input id="meta-title"></div>
      <div class="field"><label for="meta-student">STUDENT</label><input id="meta-student"></div>
      <div class="field"><label for="meta-course">COURSE</label><input id="meta-course"></div>
      <div class="field"><label for="meta-date">DATE</label><input id="meta-date" type="date"></div>
    </div>
    <div class="export-options">
      <button class="export-option" data-export="md"><b>MARKDOWN</b><span>Portable source with assignment metadata and readable Unicode math.</span></button>
      <button class="export-option" data-export="tex"><b>LATEX</b><span>Article document using amsmath, amssymb, amsthm, and classroom margins.</span></button>
      <button class="export-option" data-export="pdf"><b>PDF</b><span>Print-ready Letter paper. Choose Save as PDF in the system print dialog.</span></button>
      <button class="export-option" data-export="txt"><b>PLAIN TEXT</b><span>Exact editor contents without conversion.</span></button>
    </div>
  </dialog>

  <article class="print-paper" id="print-paper" aria-label="Printable assignment"></article>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']], processEscapes: true },
      svg: { fontCache: 'local' },
      startup: { typeset: false }
    };
  </script>
  <script src="vendor/tex-svg.js"></script>
  <script id="folio-app">
    const STORAGE_KEY = 'folio-desktop-v4';
    const LEGACY_STORAGE_KEY = 'folio-desktop-v3';
    const seeds = {
      linalg: '# Linear algebra\n\nA = [1 2 1; 2 5 3; 1 0 8]\n\nR₂ ← R₂ − 2R₁\nR₃ ← R₃ − R₁\n',
      calculus: '# Calculus\n\nf(x) = x²eˣ\n\n∫ x²eˣ dx\n',
      proof: '# Proof\n\nTheorem: √2 is irrational.\n\nproof by contradiction\nassume √2 = a/b, gcd(a,b) = 1\n'
    };
    const starterDocument = '# Mixed methods\n\n## Linear algebra\n$A = \\begin{bmatrix}1 & 2 \\\\ 3 & 4\\end{bmatrix}$\n\n$R_2 \\leftarrow R_2 - 3R_1$\n\n## Calculus\n$$\\int_0^1 x^2 \\, dx = \\frac{1}{3}$$\n\nSwitch math modes with Ctrl-m. The file does not change.\n';
    const assignmentTemplates = {
      linalg: '# Problems\n\n## Problem 1\n\n### Given\n$A = \\begin{bmatrix}1 & 0 \\\\ 0 & 1\\end{bmatrix}$\n\n### Task\nCompute $\\operatorname{rref}(A)$.\n\n### Work\n$R_2 \\leftarrow R_2 - R_1$\n\n### Answer\n$[state the result]$\n',
      calculus: '# Problems\n\n## Problem 1\n\n### Given\n$f(x) = [enter the function]$\n\n### Task\nEvaluate the integral.\n\n### Work\n$$\\int f(x) \\, dx + C$$\n\n### Answer\n$[state the result]$\n',
      proof: '# Problems\n\n## Problem 1\n\nTheorem: [state the claim].\n\nProof:\nassume [hypotheses]\n\n[derive the next statement]\n    by [justification]\n\n∎\n'
    };
    const bufferTree = ['▾ current-file', '● workspace', '· references', '· scratch'];
    const contexts = {
      linalg: {
        label: 'LINALG', aliases: ['1', 'linalg', 'linauge', 'linear', 'linear algebra'],
        assumption: 'Matrix and vector operations. Arithmetic domain: ℝ.',
        macros: [
          ['\\ c', 'copy last matrix', () => repeatLastMatrix(false)],
          ['\\ n', 'next row-reduction step', () => repeatLastMatrix(true)],
          ['\\ t', 'transform to RREF', () => wrapLastMatrix('rref')],
          ['\\ b', 'build determinant', () => wrapLastMatrix('det')]
        ]
      },
      calculus: {
        label: 'CALC', aliases: ['2', 'calc', 'calculus'],
        assumption: 'Primary variable: x. Indefinite integrals include + C.',
        macros: [
          ['\\ c', 'copy last expression', () => duplicatePreviousLine('prior expression copied')],
          ['\\ n', 'continue last derivation', continuePreviousLine],
          ['\\ t', 'differentiate expression', () => transformPreviousLine('differentiate')],
          ['\\ b', 'build integral', () => transformPreviousLine('integrate')]
        ]
      },
      proof: {
        label: 'PROOF', aliases: ['3', 'proof'],
        assumption: 'Natural-deduction writing with explicit justifications.',
        macros: [
          ['\\ c', 'copy prior step', () => duplicatePreviousLine('prior proof step copied')],
          ['\\ n', 'continue with justification', continueProofStep],
          ['\\ t', 'transform by inference', buildInferenceRule],
          ['\\ b', 'build contradiction', buildContradiction]
        ]
      }
    };

    const commonSnippets = {
      fr: '$\\frac{|}{}$', sq: '$\\sqrt{|}$', sum: '$\\sum_{i=1}^{n} |$',
      prod: '$\\prod_{i=1}^{n} |$', cases: '$$\\begin{cases}| \\\\ \\end{cases}$$'
    };
    const modeSnippets = {
      linalg: {
        m2: '$\\begin{bmatrix}| &  \\\\  & \\end{bmatrix}$',
        m3: '$\\begin{bmatrix}| &  &  \\\\  &  &  \\\\  &  & \\end{bmatrix}$',
        aug: '$\\left[\\begin{array}{cc|c}| &  &  \\\\  &  & \\end{array}\\right]$'
      },
      calculus: {
        int: '$\\int | \\, dx + C$', dint: '$\\int_{a}^{b} | \\, dx$',
        lim: '$\\lim_{x \\to |} $', der: '$\\frac{d}{dx}\\left(|\\right)$'
      },
      proof: {
        imp: '$| \\implies $', iff: '$| \\iff $', contra: '$| \\implies \\bot$'
      }
    };

    const help = {
      overview: {
        title: 'Start here',
        text: 'Folio has one file and two independent mode systems. Vim mode controls editing. Math mode changes local keybindings and assumptions without changing the file.',
        rows: [['i / Esc', 'Enter Insert mode / return to Normal mode'], ['Ctrl-m', 'Cycle Linear Algebra, Calculus, and Proof binds'], ['\\ c/n/t/b', 'Copy / next / transform / build in the active math mode'], ['fr then Tab', 'Expand a short token into editable LaTeX'], [':M', 'List math modes'], ['$x_1^2$', 'Compile inline LaTeX in the live view'], ['$$...$$', 'Compile display LaTeX'], [':template', 'Load the editable Problem Set template'], [':export format', 'Export md, tex, pdf, or txt']]
      },
      modes: {
        title: 'Math modes',
        text: 'Math mode is local behavior over one persistent file. Switching changes backslash-leader macros and assumptions; text, cursor position, undo history, and Vim mode stay intact.',
        rows: [['Ctrl-m', 'Cycle to the next math mode'], [':M 1 or :M linalg', 'Use Linear Algebra binds'], [':M 2 or :M calc', 'Use Calculus binds'], [':M 3 or :M proof', 'Use Proof binds'], [':M', 'Show the selectable mode list']]
      },
      latex: {
        title: 'Live LaTeX',
        text: 'The right pane compiles TeX continuously. Use dollar delimiters in the source file; the source remains plain text and exports directly.',
        rows: [['$x_1^2$', 'Inline subscript and superscript'], ['$$\\int_0^1 x^2 \\, dx$$', 'Centered display equation'], ['$\\frac{a}{b}$', 'Fraction'], ['$\\sqrt{x}$', 'Square root'], ['$\\begin{bmatrix}1 & 0 \\\\ 0 & 1\\end{bmatrix}$', 'Matrix']]
      },
      vim: {
        title: 'Vim editing',
        text: 'Normal mode navigates and operates on text. Insert mode types. Visual mode selects ranges.',

      },
      macros: {

      },

      },
      template: {

      },
      commands: {
        title: 'Commands',
        text: 'Press colon in Normal mode, type a command, and press Enter.',
        rows: [[':M [mode]', 'List or switch math mode without changing the file'], [':preview', 'Show or hide the compiled document'], [':help [topic]', 'Open overview, modes, latex, vim, macros, template, commands, or export'], [':template / :template!', 'Load safely / replace with the Problem Set template'], [':set title TEXT', 'Set assignment title'], [':set student TEXT', 'Set student name'], [':set course TEXT', 'Set course'], [':set date YYYY-MM-DD', 'Set submission date'], [':w', 'Save locally'], [':new', 'Clear the current file'], [':export [md|tex|pdf|txt]', 'Export the current document']]
      },
      export: {
        title: 'Export and submit',
        text: 'Set assignment metadata before export. Markdown and LaTeX download immediately. PDF opens the system print dialog with a clean Letter-size classroom layout; select Save as PDF.',
        rows: [[':export md', 'Download Markdown'], [':export tex', 'Download a complete LaTeX article'], [':export pdf', 'Open the print-ready paper'], [':export txt', 'Download exact source text'], [':set title ...', 'Set the title used by every formatted export']]
      }
    };

    const app = document.querySelector('.app');
    const editor = document.querySelector('#editor');
    const gutter = document.querySelector('#gutter');
    const tree = document.querySelector('#tree');
    const keys = document.querySelector('#keys');
    const readout = document.querySelector('#readout');
    const assumption = document.querySelector('#assumption');
    const editorStateLabel = document.querySelector('#editor-state');
    const mathStateLabel = document.querySelector('#math-state');
    const message = document.querySelector('#message');
    const position = document.querySelector('#position');
    const charCount = document.querySelector('#char-count');
    const dirtyMark = document.querySelector('#dirty-mark');
    const commandbar = document.querySelector('#commandbar');
    const commandInput = document.querySelector('#command-input');
    const modeList = document.querySelector('#mode-list');
    const helpDialog = document.querySelector('#help-dialog');
    const helpTopics = document.querySelector('#help-topics');
    const helpContent = document.querySelector('#help-content');
    const helpSearch = document.querySelector('#help-search');
    const exportDialog = document.querySelector('#export-dialog');
    const printPaper = document.querySelector('#print-paper');
    const previewBody = document.querySelector('#preview-body');
    const previewMode = document.querySelector('#preview-mode');

    let saved = loadState();
    let documentText = saved.document ?? saved.documents?.[saved.current] ?? starterDocument;
    let metadata = {
      title: 'Untitled Assignment',
      student: '',
      course: '',
      date: new Date().toISOString().slice(0, 10),
      ...(saved.metadata || {})
    };
    let current = saved.current && contexts[saved.current] ? saved.current : 'linalg';
    let editorState = 'NORMAL';
    let pending = '';
    let leader = false;
    let visualAnchor = 0;
    let clipboard = '';
    let clipboardLinewise = false;
    let recording = '';
    let recordedKeys = [];
    let registers = saved.registers || {};
    let replaying = false;
    let history = { undo: [], redo: [] };
    let previousText = documentText;
    let typesetQueue = Promise.resolve();
    let previewTimer = 0;

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function persist() {
      documentText = editor.value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ document: documentText, current, registers, metadata }));
      dirtyMark.textContent = '— saved locally';
    }

    function setMessage(text) { message.textContent = text; }

    function setEditorState(next) {
      editorState = next;
      app.dataset.editorState = next;
      editorStateLabel.textContent = next;
      editor.readOnly = next !== 'INSERT';
      editor.focus();
      if (next !== 'VISUAL') visualAnchor = editor.selectionStart;
      updateMeta();
    }

    function lineInfo(offset = editor.selectionEnd) {
      const before = editor.value.slice(0, offset);
      const line = before.split('\n').length - 1;
      const start = before.lastIndexOf('\n') + 1;
      const endIndex = editor.value.indexOf('\n', offset);
      const end = endIndex < 0 ? editor.value.length : endIndex;
      return { line, column: offset - start, start, end };
    }

    function updateMeta() {
      const info = lineInfo();
      position.textContent = `${info.line + 1}:${info.column + 1}`;
      charCount.textContent = `${editor.value.length} CHARS`;
      readout.innerHTML = `<span>line</span><b>${info.line + 1}</b><span>column</span><b>${info.column + 1}</b><span>selection</span><b>${Math.abs(editor.selectionEnd - editor.selectionStart)}</b><span>register</span><b>${recording || '—'}</b>`;
      renderGutter(info.line);
    }

    function renderGutter(activeLine = lineInfo().line) {
      const count = editor.value.split('\n').length;
      gutter.innerHTML = Array.from({ length: count }, (_, index) => `<span class="${index === activeLine ? 'active' : ''}">${index + 1}</span>`).join('');
      gutter.scrollTop = editor.scrollTop;
    }

    function renderContext(name) {
      current = name;
      const context = contexts[name];
      app.dataset.mathContext = name;
      mathStateLabel.textContent = context.label;
      previewMode.textContent = `${context.label} BINDS`;
      document.querySelectorAll('[data-mode-choice]').forEach(button => button.classList.toggle('active', button.dataset.modeChoice === name));
      tree.innerHTML = bufferTree.map((item, index) => `<button class="${index ? 'indent ' : ''}${item.includes('●') ? 'active' : ''}">${item}</button>`).join('');
      keys.innerHTML = context.macros.map(([key, action]) => `<p><span>${action}</span><kbd>${key}</kbd></p>`).join('');
      assumption.textContent = context.assumption;
      setMessage(`${context.label} · ${context.macros.map(item => item[0]).join('  ')}`);
      persist();
      renderPreview();
    }

    function cycleMathMode() {
      const names = Object.keys(contexts);
      renderContext(names[(names.indexOf(current) + 1) % names.length]);
    }

    function syncPreviewButton() {
      const compact = matchMedia('(max-width: 1100px)').matches;
      const showingPreview = compact ? app.classList.contains('preview-only') : !app.classList.contains('preview-hidden');
      document.querySelector('#preview-button').textContent = compact ? (showingPreview ? 'SOURCE' : 'VIEW') : (showingPreview ? 'HIDE VIEW' : 'VIEW');
    }

    function togglePreview() {
      const compact = matchMedia('(max-width: 1100px)').matches;
      if (compact) app.classList.toggle('preview-only');
      else app.classList.toggle('preview-hidden');
      const showingPreview = compact ? app.classList.contains('preview-only') : !app.classList.contains('preview-hidden');
      syncPreviewButton();
      if (!showingPreview) editor.focus();
      setMessage(showingPreview ? 'compiled document visible' : 'source editor visible');
    }

    function findContext(value) {
      const normalized = value.trim().toLowerCase();
      return Object.keys(contexts).find(name => contexts[name].aliases.includes(normalized));
    }

    function showCommand(initial = ':') {
      commandbar.hidden = false;
      commandInput.value = initial;
      commandInput.focus();
      commandInput.setSelectionRange(initial.length, initial.length);
      setMessage('COMMAND');
      updateModeList();
    }

    function closeCommand() {
      commandbar.hidden = true;
      modeList.hidden = true;
      editor.focus();
      setMessage(`${contexts[current].label} binds · Ctrl-m cycles mode`);
    }

    function updateModeList() {
      const value = commandInput.value.trim();
      modeList.hidden = !/^:M(?:\s.*)?$/i.test(value);
    }

    function openHelp(topic = 'overview') {
      const selected = help[topic] ? topic : 'overview';
      if (!helpDialog.open) helpSearch.value = '';
      helpTopics.innerHTML = Object.entries(help).map(([key, value]) => `<button class="${key === selected ? 'active' : ''}" data-help-topic="${key}">${key.toUpperCase()}<br><span>${value.title}</span></button>`).join('');
      const item = help[selected];
      helpContent.innerHTML = `<h3>${item.title}</h3><p>${item.text}</p><table class="help-table"><tbody>${item.rows.map(([key, description]) => `<tr><th><kbd>${key}</kbd></th><td>${description}</td></tr>`).join('')}</tbody></table>`;
      helpTopics.querySelectorAll('[data-help-topic]').forEach(button => button.addEventListener('click', () => openHelp(button.dataset.helpTopic)));
      filterHelp(helpSearch.value);
      if (!helpDialog.open) helpDialog.showModal();
      setMessage(`HELP · ${selected}`);
    }

    function filterHelp(query) {
      const normalized = query.trim().toLowerCase();
      helpTopics.querySelectorAll('[data-help-topic]').forEach(button => {
        const topic = help[button.dataset.helpTopic];
        button.hidden = normalized && !`${button.dataset.helpTopic} ${topic.title} ${topic.text} ${topic.rows.flat().join(' ')}`.toLowerCase().includes(normalized);
      });
    }

    function syncMetadataFromForm() {
      metadata = {
        title: document.querySelector('#meta-title').value.trim() || 'Untitled Assignment',
        student: document.querySelector('#meta-student').value.trim(),
        course: document.querySelector('#meta-course').value.trim(),
        date: document.querySelector('#meta-date').value || new Date().toISOString().slice(0, 10)
      };
      persist();
      buildPrintPaper();
    }

    function openExport() {
      document.querySelector('#meta-title').value = metadata.title;
      document.querySelector('#meta-student').value = metadata.student;
      document.querySelector('#meta-course').value = metadata.course;
      document.querySelector('#meta-date').value = metadata.date;
      if (!exportDialog.open) exportDialog.showModal();
      setMessage('EXPORT · choose a format');
    }

    function safeFilename(extension) {
      const base = metadata.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `folio-${current}`;
      return `${base}.${extension}`;
    }

    function downloadFile(content, extension, mime) {
      const blob = new Blob([content], { type: `${mime};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = safeFilename(extension);
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      setMessage(`exported ${safeFilename(extension)}`);
    }

    function yamlValue(value) { return `"${String(value).replaceAll('"', '\\"')}"`; }

    function toMarkdown() {
      return `---\ntitle: ${yamlValue(metadata.title)}\nauthor: ${yamlValue(metadata.student)}\ncourse: ${yamlValue(metadata.course)}\ndate: ${yamlValue(metadata.date)}\n---\n\n# ${metadata.title}\n\n${editor.value.trim()}\n`;
    }

    function latexEscape(value) {
      const escapes = { '\\': '\\textbackslash{}', '&': '\\&', '%': '\\%', '#': '\\#', '$': '\\$', '{': '\\{', '}': '\\}', '_': '\\_', '~': '\\textasciitilde{}', '^': '\\textasciicircum{}' };
      return String(value).replace(/[\\&%#$\{\}_~^]/g, character => escapes[character]);
    }

    function toLatexProse(value) {
      return String(value).split(/(\$[^$]+\$)/g).map(part => {
        if (part.startsWith('$') && part.endsWith('$')) return `\\(${part.slice(1, -1)}\\)`;
        return latexEscape(part).replace(/√\s*([A-Za-z0-9]+)/g, '\\(\\sqrt{$1}\\)');
      }).join('');
    }

    function matrixToLatex(line) {
      return line.replace(/\[([^\[\]]*;[^\[\]]*)\]/g, (_, body) => {
        const rows = body.split(';').map(row => row.trim().split(/\s+/).join(' & '));
        return `\\begin{bmatrix}${rows.join(' \\\\ ')}\\end{bmatrix}`;
      });
    }

    function toLatexMath(line) {
      let value = matrixToLatex(line);
      const replacements = [
        [/√\s*([A-Za-z0-9]+)/g, '\\sqrt{$1}'], [/∫/g, '\\int'], [/←/g, '\\leftarrow'], [/→/g, '\\to'], [/↔/g, '\\leftrightarrow'],
        [/−/g, '-'], [/×/g, '\\times '], [/÷/g, '\\div '], [/∞/g, '\\infty'], [/∑/g, '\\sum'], [/π/g, '\\pi'], [/θ/g, '\\theta'],
        [/≤/g, '\\leq'], [/≥/g, '\\geq'], [/≠/g, '\\neq'], [/∈/g, '\\in'], [/∉/g, '\\notin'], [/ℝ/g, '\\mathbb{R}'], [/ℚ/g, '\\mathbb{Q}'],
        [/₀/g, '_{0}'], [/₁/g, '_{1}'], [/₂/g, '_{2}'], [/₃/g, '_{3}'], [/₄/g, '_{4}'], [/₅/g, '_{5}'], [/₆/g, '_{6}'], [/₇/g, '_{7}'], [/₈/g, '_{8}'], [/₉/g, '_{9}'],
        [/⁰/g, '^{0}'], [/¹/g, '^{1}'], [/²/g, '^{2}'], [/³/g, '^{3}'], [/∎/g, '\\qed'], [/\bgcd\b/g, '\\gcd'], [/\blim_/g, '\\lim_']
      ];
      replacements.forEach(([pattern, replacement]) => { value = value.replace(pattern, replacement); });
      value = value.replace(/^(assume|therefore|let|rewrite|proof by)\s+/i, match => `\\text{${match}}`);
      return value;
    }

    function toLatex() {
      const body = editor.value.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('### ')) return `\\subsubsection*{${latexEscape(trimmed.slice(4))}}`;
        if (trimmed.startsWith('## ')) return `\\subsection*{${latexEscape(trimmed.slice(3))}}`;
        if (trimmed.startsWith('# ')) return `\\section*{${latexEscape(trimmed.slice(2))}}`;
        if (trimmed.startsWith('$$') && trimmed.endsWith('$$')) return `\\[${trimmed.slice(2, -2)}\\]`;
        if (trimmed.startsWith('$') && trimmed.endsWith('$')) return `\\[${trimmed.slice(1, -1)}\\]`;
        if (/^Theorem:/i.test(trimmed)) return `\\begin{theorem}${toLatexProse(trimmed.replace(/^Theorem:\s*/i, ''))}\\end{theorem}`;
        if (/^Proof:$/i.test(trimmed)) return '\\begin{proof}';
        if (/^proof by\b/i.test(trimmed)) return `\\noindent\\textit{${latexEscape(trimmed.replace(/^proof/i, 'Proof'))}.}\\par`;
        if (trimmed === '∎') return '\\end{proof}';
        if (/^(assume|therefore|let|rewrite|by)\b/i.test(trimmed) || trimmed.includes('$')) return `\\noindent ${toLatexProse(trimmed)}\\par`;
        if (!lineKind(trimmed)) return `\\noindent ${toLatexProse(trimmed)}\\par`;
        return `\\[${toLatexMath(trimmed)}\\]`;
      }).join('\n');
      return `\\documentclass[11pt]{article}\n\\usepackage[letterpaper,margin=1in]{geometry}\n\\usepackage{amsmath,amssymb,amsthm}\n\\newtheorem{theorem}{Theorem}\n\\title{${latexEscape(metadata.title)}}\n\\author{${latexEscape(metadata.student)}}\n\\date{${latexEscape(metadata.date)}}\n\\begin{document}\n\\maketitle\n\\noindent\\textbf{Course:} ${latexEscape(metadata.course)}\\par\n\\noindent\\textbf{Math context:} ${latexEscape(contexts[current].label)}\\par\n\\bigskip\n${body}\n\\end{document}\n`;
    }

    function lineKind(line) {
      if (/^(assume|therefore|let|proof|rewrite|by)\b/i.test(line.trim())) return 'proof';
      if (/^\$\$.*\$\$$/.test(line.trim()) || /^\$[^$]+\$$/.test(line.trim()) || /[=∫√←→↔\[\]²³₀₁₂₃]/.test(line)) return 'formula';
      return '';
    }

    function appendDocument(target, print = false) {
      editor.value.split('\n').forEach(line => {
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          const level = print ? Math.min(3, heading[1].length + 1) : heading[1].length;
          const element = document.createElement(`h${level}`);
          element.textContent = heading[2];
          target.append(element);
          return;
        }
        const paragraph = document.createElement('p');
        paragraph.className = `${print ? 'paper-line ' : ''}${lineKind(line)}`;
        paragraph.textContent = line || ' ';
        target.append(paragraph);
      });
    }

    function queueTypeset(target) {
      if (!window.MathJax?.startup?.promise) return Promise.resolve();
      typesetQueue = typesetQueue.then(() => window.MathJax.startup.promise).then(() => {
        window.MathJax.typesetClear([target]);
        return window.MathJax.typesetPromise([target]);
      }).catch(() => setMessage('LaTeX error · check delimiters or command syntax'));
      return typesetQueue;
    }

    function renderPreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        previewBody.replaceChildren();
        appendDocument(previewBody);
        queueTypeset(previewBody);
      }, 80);
    }

    function buildPrintPaper() {
      printPaper.replaceChildren();
      const title = document.createElement('h1');
      title.className = 'paper-title';
      title.textContent = metadata.title;
      const meta = document.createElement('div');
      meta.className = 'paper-meta';
      [['Student', metadata.student || '—'], ['Course', metadata.course || '—'], ['Date', metadata.date]].forEach(([label, value]) => {
        const span = document.createElement('span'); span.textContent = `${label}: ${value}`; meta.append(span);
      });
      const body = document.createElement('div');
      body.className = 'paper-body';
      appendDocument(body, true);
      printPaper.append(title, meta, body);
      return queueTypeset(printPaper);
    }

    async function exportFormat(format) {
      if (exportDialog.open) syncMetadataFromForm();
      else { persist(); buildPrintPaper(); }
      if (exportDialog.open) exportDialog.close();
      if (format === 'md') downloadFile(toMarkdown(), 'md', 'text/markdown');
      else if (format === 'tex') downloadFile(toLatex(), 'tex', 'application/x-tex');
      else if (format === 'txt') downloadFile(editor.value, 'txt', 'text/plain');
      else if (format === 'pdf') { await buildPrintPaper(); setMessage('PDF · choose Save as PDF in the print dialog'); window.print(); }
    }

    function applyAssignmentTemplate(force = false) {
      const untouched = !editor.value.trim() || Object.values(seeds).includes(editor.value) || editor.value === starterDocument || Object.values(assignmentTemplates).includes(editor.value);
      if (!untouched && !force) { setMessage('buffer has work · use :template! to replace it'); return; }
      pushHistory();
      editor.value = assignmentTemplates[current];
      previousText = editor.value;
      documentText = editor.value;
      const placeholder = editor.value.indexOf('[');
      editor.setSelectionRange(placeholder < 0 ? 0 : placeholder, placeholder < 0 ? 0 : placeholder);
      persist(); renderPreview(); updateMeta();
      setMessage('Problem Set template loaded · press i to edit');
    }

    function runCommand(raw) {
      const command = raw.replace(/^:/, '').trim();
      const modeMatch = command.match(/^M(?:\s+(.*))?$/i);
      if (modeMatch) {
        if (!modeMatch[1]) {
          modeList.hidden = false;
          setMessage('Choose 1–3 or type linalg, calc, or proof');
          return;
        }
        const mode = findContext(modeMatch[1]);
        if (!mode) { setMessage(`Unknown math context: ${modeMatch[1]}`); return; }
        closeCommand();
        renderContext(mode);
        return;
      }
      const helpMatch = command.match(/^help(?:\s+(\w+))?$/i);
      if (helpMatch) { closeCommand(); openHelp((helpMatch[1] || 'overview').toLowerCase()); return; }
      if (command === 'preview' || command === 'view') { closeCommand(); togglePreview(); return; }
      if (/^template!?$/i.test(command)) { closeCommand(); applyAssignmentTemplate(command.endsWith('!')); return; }
      const setMatch = command.match(/^set\s+(title|student|course|date)\s+(.+)$/i);
      if (setMatch) {
        metadata[setMatch[1].toLowerCase()] = setMatch[2].trim();
        persist(); buildPrintPaper(); closeCommand(); setMessage(`${setMatch[1].toLowerCase()} updated`); return;
      }
      const exportMatch = command.match(/^export(?:\s+(md|markdown|tex|latex|pdf|txt|text))?$/i);
      if (exportMatch) {
        closeCommand();
        if (!exportMatch[1]) openExport();
        else exportFormat({ markdown: 'md', latex: 'tex', text: 'txt' }[exportMatch[1].toLowerCase()] || exportMatch[1].toLowerCase());
        return;
      }
      if (command === 'w') { persist(); closeCommand(); setMessage('saved locally'); return; }
      if (command === 'new' || command === 'reset') { closeCommand(); resetBuffer(); return; }
      if (command === 'q') { closeCommand(); setMessage('Folio runs in the browser; close the tab to quit'); return; }
      setMessage(`Not an editor command: ${command}`);
    }

    function snapshot() { return { text: editor.value, start: editor.selectionStart, end: editor.selectionEnd }; }

    function pushHistory() {
      history.undo.push(snapshot());
      if (history.undo.length > 100) history.undo.shift();
      history.redo = [];
    }

    function restore(state) {
      editor.value = state.text;
      editor.setSelectionRange(state.start, state.end);
      previousText = editor.value;
      documentText = editor.value;
      persist();
      renderPreview();
      updateMeta();
    }

    function undo() {
      if (!history.undo.length) { setMessage('already at oldest change'); return; }
      history.redo.push(snapshot());
      restore(history.undo.pop());
      setMessage('undo');
    }

    function redo() {
      if (!history.redo.length) { setMessage('already at newest change'); return; }
      history.undo.push(snapshot());
      restore(history.redo.pop());
      setMessage('redo');
    }

    function replaceRange(start, end, replacement, caret = start + replacement.length) {
      pushHistory();
      editor.value = editor.value.slice(0, start) + replacement + editor.value.slice(end);
      editor.setSelectionRange(caret, caret);
      previousText = editor.value;
      documentText = editor.value;
      dirtyMark.textContent = '— modified';
      persist();
      renderPreview();
      updateMeta();
    }

    function insertTemplate(template, message = `${contexts[current].label} macro inserted`) {
      const marker = template.indexOf('|');
      const clean = template.replace('|', '');
      const caret = editor.selectionStart + (marker < 0 ? clean.length : marker);
      replaceRange(editor.selectionStart, editor.selectionEnd, clean, caret);
      setEditorState('INSERT');
      setMessage(message);
    }

    function previousContentLine() {
      const lines = editor.value.slice(0, lineInfo().end).split('\n');
      return lines.reverse().find(line => line.trim() && !/^#{1,6}\s/.test(line.trim()))?.trim() || '';
    }

    function mathBody(line) {
      return line.trim().replace(/^\$\$?/, '').replace(/\$\$?$/, '').trim();
    }

    function appendTemplate(template, message) {
      const at = lineInfo().end;
      const separator = at > 0 && editor.value[at - 1] !== '\n' ? '\n' : '';
      editor.setSelectionRange(at, at);
      insertTemplate(separator + template, message);
    }

    function duplicatePreviousLine(message = 'prior line copied') {
      const line = previousContentLine();
      if (!line) { setMessage('No prior line to copy'); return; }
      appendTemplate(`${line}|`, message);
    }

    function continuePreviousLine() {
      const line = previousContentLine();
      if (!line) { setMessage('No prior expression to continue'); return; }
      appendTemplate(`$${mathBody(line)} = |$`, 'prior expression continued');
    }

    function transformPreviousLine(operation) {
      const line = previousContentLine();
      if (!line) { setMessage('No prior expression to transform'); return; }
      const expression = mathBody(line);
      const template = operation === 'differentiate'
        ? `$$\\frac{d}{dx}\\left(${expression}\\right) = |$$`
        : `$$\\int \\left(${expression}\\right)\\,dx = | + C$$`;
      appendTemplate(template, `${operation} prior expression`);
    }

    function continueProofStep() {
      const line = previousContentLine();
      if (!line) { setMessage('No prior proof step to continue'); return; }
      appendTemplate(`$${mathBody(line)} \\qquad \\text{by }|$`, 'proof step copied; enter justification');
    }

    function buildInferenceRule() {
      const line = previousContentLine();
      if (!line) { setMessage('No prior proof step for an inference rule'); return; }
      appendTemplate(`$$\\frac{${mathBody(line)}}{[next statement]}\\quad\\text{by }|$$`, 'inference rule created; enter method');
    }

    function buildContradiction() {
      const line = previousContentLine();
      if (!line) { setMessage('No prior proof step for a contradiction'); return; }
      appendTemplate(`$${mathBody(line)} \\implies \\bot \\qquad \\text{contradiction from }|$`, 'contradiction created; enter references');
    }

    function repeatLastMatrix(withOperation) {
      const source = editor.value.slice(0, lineInfo().end);
      const matrices = [...source.matchAll(/\\begin\{([pbBvV]?matrix)\}[\s\S]*?\\end\{\1\}/g)];
      const matrix = matrices.at(-1)?.[0];
      if (!matrix) { setMessage('No earlier LaTeX matrix to copy'); return; }
      if (withOperation) {
        appendTemplate(`$$\\xrightarrow{R_|}\n${matrix}$$`, 'matrix copied; enter the row operation');
        return;
      }
      const beginEnd = matrix.indexOf('}') + 1;
      const editableCopy = matrix.slice(0, beginEnd) + '|' + matrix.slice(beginEnd);
      appendTemplate(`$$${editableCopy}$$`, 'last matrix copied');
    }

    function wrapLastMatrix(operation) {
      const source = editor.value.slice(0, lineInfo().end);
      const matrices = [...source.matchAll(/\\begin\{([pbBvV]?matrix)\}[\s\S]*?\\end\{\1\}/g)];
      const matrix = matrices.at(-1)?.[0];
      if (!matrix) { setMessage('No earlier LaTeX matrix to transform'); return; }
      const operator = operation === 'rref' ? '\\operatorname{rref}' : '\\det';
      appendTemplate(`$$${operator}\\left(${matrix}\\right) = |$$`, `${operation.toUpperCase()} expression created`);
    }

    function expandSnippet() {
      const caret = editor.selectionStart;
      const match = editor.value.slice(0, caret).match(/([a-z0-9]+)$/i);
      const key = match?.[1].toLowerCase();
      const template = key && (modeSnippets[current][key] || commonSnippets[key]);
      if (!template) return false;
      editor.setSelectionRange(caret - key.length, caret);
      insertTemplate(template, `${key} expanded`);
      return true;
    }

    function moveHorizontal(delta, extend = false) {
      const info = lineInfo();
      const next = Math.max(info.start, Math.min(info.end, editor.selectionEnd + delta));
      setCaret(next, extend);
    }

    function moveVertical(delta, extend = false) {
      const info = lineInfo();
      const lines = editor.value.split('\n');
      const targetLine = Math.max(0, Math.min(lines.length - 1, info.line + delta));
      let target = 0;
      for (let index = 0; index < targetLine; index += 1) target += lines[index].length + 1;
      target += Math.min(info.column, lines[targetLine].length);
      setCaret(target, extend);
    }

    function setCaret(offset, extend = false) {
      if (extend || editorState === 'VISUAL') editor.setSelectionRange(Math.min(visualAnchor, offset), Math.max(visualAnchor, offset));
      else editor.setSelectionRange(offset, offset);
      updateMeta();
    }

    function deleteLine() {
      const info = lineInfo();
      const end = info.end < editor.value.length ? info.end + 1 : info.end;
      clipboard = editor.value.slice(info.start, end);
      clipboardLinewise = true;
      replaceRange(info.start, end, '', Math.min(info.start, editor.value.length));
      setMessage('line deleted');
    }

    function yankLine() {
      const info = lineInfo();
      const end = info.end < editor.value.length ? info.end + 1 : info.end;
      clipboard = editor.value.slice(info.start, end);
      clipboardLinewise = true;
      setMessage('line yanked');
    }

    function paste() {
      if (!clipboard) { setMessage('register is empty'); return; }
      const info = lineInfo();
      const at = clipboardLinewise ? Math.min(info.end + 1, editor.value.length) : editor.selectionEnd;
      replaceRange(at, at, clipboard, at + clipboard.length);
      setMessage('pasted');
    }

    function openLine(below) {
      const info = lineInfo();
      const at = below ? info.end : info.start;
      const value = below ? '\n' : '\n';
      replaceRange(at, at, value, below ? at + 1 : at);
      setEditorState('INSERT');
    }

    function applyMathMacro(key) {
      const macro = contexts[current].macros.find(item => item[0].toLowerCase() === `\\ ${key.toLowerCase()}`);
      if (!macro) { setMessage(`No \\ ${key} macro in ${contexts[current].label}`); return; }
      macro[2]();
    }

    function playRegister(name) {
      const keys = registers[name];
      if (!keys?.length) { setMessage(`macro @${name} is empty`); return; }
      replaying = true;
      keys.forEach(key => handleNormalKey(key));
      replaying = false;
      setMessage(`played macro @${name}`);
    }

    function handleNormalKey(key, ctrl = false) {
      if (recording && !replaying && key !== 'q') recordedKeys.push(key);
      if (ctrl && key.toLowerCase() === 'r') { redo(); return; }
      if (leader) { leader = false; applyMathMacro(key); return; }
      if (pending === 'q') { recording = key.toLowerCase(); recordedKeys = []; pending = ''; setMessage(`recording @${recording}`); return; }
      if (pending === '@') { const register = key.toLowerCase(); pending = ''; playRegister(register); return; }
      if (pending === 'd' && key === 'd') { pending = ''; deleteLine(); return; }
      if (pending === 'y' && key === 'y') { pending = ''; yankLine(); return; }
      if (pending === 'g' && key === 'g') { pending = ''; setCaret(0); return; }
      pending = '';
      const info = lineInfo();
      if (key === '\\') { leader = true; setMessage(`${contexts[current].label} macro · ${contexts[current].macros.map(item => item[0]).join('  ')}`); }
      else if (key === 'i') setEditorState('INSERT');
      else if (key === 'a') { setCaret(Math.min(info.end, editor.selectionEnd + 1)); setEditorState('INSERT'); }
      else if (key === 'I') { setCaret(info.start); setEditorState('INSERT'); }
      else if (key === 'A') { setCaret(info.end); setEditorState('INSERT'); }
      else if (key === 'o') openLine(true);
      else if (key === 'O') openLine(false);
      else if (key === 'h') moveHorizontal(-1);
      else if (key === 'l') moveHorizontal(1);
      else if (key === 'j') moveVertical(1);
      else if (key === 'k') moveVertical(-1);
      else if (key === '0') setCaret(info.start);
      else if (key === '$') setCaret(info.end);
      else if (key === 'G') setCaret(editor.value.length);
      else if (key === 'g' || key === 'd' || key === 'y' || key === '@') pending = key;
      else if (key === 'w') { const match = editor.value.slice(editor.selectionEnd + 1).match(/\b\w/); setCaret(match ? editor.selectionEnd + 1 + match.index : editor.value.length); }
      else if (key === 'b') { const text = editor.value.slice(0, Math.max(0, editor.selectionEnd - 1)); const matches = [...text.matchAll(/\b\w/g)]; setCaret(matches.length ? matches.at(-1).index : 0); }
      else if (key === 'x' && editor.selectionEnd < editor.value.length) replaceRange(editor.selectionEnd, editor.selectionEnd + 1, '', editor.selectionEnd);
      else if (key === 'p') paste();
      else if (key === 'u') undo();
      else if (key === 'v') { visualAnchor = editor.selectionEnd; setEditorState('VISUAL'); setMessage('VISUAL · h/j/k/l select · y/d/c operate'); }
      else if (key === 'q') {
        if (recording) { registers[recording] = [...recordedKeys]; setMessage(`recorded @${recording}`); recording = ''; recordedKeys = []; persist(); }
        else pending = 'q';
      }
    }

    function handleVisualKey(key) {
      if (key === 'h') moveHorizontal(-1, true);
      else if (key === 'l') moveHorizontal(1, true);
      else if (key === 'j') moveVertical(1, true);
      else if (key === 'k') moveVertical(-1, true);
      else if (key === 'y') { clipboard = editor.value.slice(editor.selectionStart, editor.selectionEnd); clipboardLinewise = false; setCaret(editor.selectionEnd); setEditorState('NORMAL'); setMessage('selection yanked'); }
      else if (key === 'd' || key === 'c') { const start = editor.selectionStart; replaceRange(start, editor.selectionEnd, '', start); setEditorState(key === 'c' ? 'INSERT' : 'NORMAL'); }
    }

    function resetBuffer() {
      pushHistory();
      editor.value = '';
      editor.setSelectionRange(0, 0);
      previousText = editor.value;
      documentText = editor.value;
      persist();
      renderPreview();
      updateMeta();
      setEditorState('NORMAL');
      setMessage('file cleared');
    }

    editor.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); persist(); setMessage('saved locally'); return; }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'm') { event.preventDefault(); cycleMathMode(); return; }
      if (event.key === 'Escape') { event.preventDefault(); setEditorState('NORMAL'); pending = ''; leader = false; setMessage(`${contexts[current].label} · NORMAL`); return; }
      if (editorState === 'INSERT') {
        if (event.key === 'Tab') {
          event.preventDefault();
          if (expandSnippet()) return;
          editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
          editor.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: '  ' }));
        }
        return;
      }
      event.preventDefault();
      if (event.key === ':') { showCommand(':'); return; }
      if (editorState === 'VISUAL') handleVisualKey(event.key);
      else handleNormalKey(event.key, event.ctrlKey || event.metaKey);
    });

    editor.addEventListener('input', () => {
      if (editor.value !== previousText) {
        history.undo.push({ text: previousText, start: editor.selectionStart, end: editor.selectionStart });
        if (history.undo.length > 100) history.undo.shift();
        history.redo = [];
        previousText = editor.value;
        documentText = editor.value;
        dirtyMark.textContent = '— modified';
        persist();
        renderPreview();
      }
      updateMeta();
    });
    editor.addEventListener('click', updateMeta);
    editor.addEventListener('keyup', updateMeta);
    editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });

    commandInput.addEventListener('input', updateModeList);
    commandInput.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); closeCommand(); }
      else if (event.key === 'Enter') { event.preventDefault(); runCommand(commandInput.value); }
    });
    document.querySelectorAll('[data-mode-choice]').forEach(button => button.addEventListener('click', () => { closeCommand(); renderContext(button.dataset.modeChoice); }));
    document.querySelector('#help-button').addEventListener('click', () => openHelp('overview'));
    document.querySelector('#preview-button').addEventListener('click', togglePreview);
    helpSearch.addEventListener('input', () => filterHelp(helpSearch.value));
    document.querySelector('#export-button').addEventListener('click', openExport);
    document.querySelector('#export-side').addEventListener('click', openExport);
    document.querySelectorAll('[data-export]').forEach(button => button.addEventListener('click', () => exportFormat(button.dataset.export)));
    document.querySelectorAll('[data-close-dialog]').forEach(button => button.addEventListener('click', () => document.querySelector(`#${button.dataset.closeDialog}`).close()));
    document.querySelectorAll('#export-dialog input').forEach(input => input.addEventListener('change', syncMetadataFromForm));
    document.querySelector('#save-button').addEventListener('click', () => { persist(); setMessage('saved locally'); });
    document.querySelector('#mode-button').addEventListener('click', cycleMathMode);
    document.querySelector('#template-button').addEventListener('click', () => applyAssignmentTemplate(false));
    document.querySelector('#new-button').addEventListener('click', resetBuffer);
    window.addEventListener('afterprint', () => setMessage('PDF print view closed'));
    window.addEventListener('resize', syncPreviewButton);

    editor.value = documentText;
    previousText = editor.value;
    renderContext(current);
    renderPreview();
    buildPrintPaper();
    syncPreviewButton();
    updateMeta();
    editor.focus();
  </script>
</body>
</html>
