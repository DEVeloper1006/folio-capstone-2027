[project]
name = "folio-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sympy>=1.13,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests"]
