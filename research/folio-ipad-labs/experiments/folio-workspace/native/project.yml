name: FolioShadow
options:
  bundleIdPrefix: dev.folio
  deploymentTarget:
    iOS: "17.0"
packages:
  FolioCore:
    path: .
targets:
  FolioShadow:
    type: application
    platform: iOS
    sources:
      - path: Sources/FolioNative
        excludes:
          - Resources
    resources:
      - path: Sources/FolioNative/Resources/Math
        type: folder
    dependencies:
      - package: FolioCore
        product: FolioCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: dev.folio.shadow
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Folio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: Connect to your Folio recognition server when you choose cloud recognition.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  FolioShadow:
    build:
      targets:
        FolioShadow: all
